[project]
name = "pudo_data"
version = "0.1.0"
description = "Mock data component: PUDO-domain synthetic source tables in `SHARED_DATA`."
requires-python = "~=3.10.0"
dependencies = [
    "cryptography>=42.0.0",
    "loguru>=0.7.3",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.0",
    "rich>=14.1.0",
    "snowflake-connector-python[secure-local-storage]>=3.18.0",
    "snowflake-snowpark-python[pandas]==1.39.1",
    "typer>=0.19.2",
]

[project.scripts]
pudo-generate = "pudo_data.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31.7",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pudo_data"]
