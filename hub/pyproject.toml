[project]
name = "hub"
version = "0.1.0"
description = "Hub component: account-level Snowflake platform resources and shared schema bootstrap."
requires-python = "~=3.10.0"
dependencies = [
    "cryptography>=42.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.0",
    "snowflake-connector-python[secure-local-storage]>=3.18.0",
    "snowflake-snowpark-python[pandas]==1.39.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.7",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]
